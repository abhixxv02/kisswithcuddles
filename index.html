<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rishuuuu ❤️</title>
    <style>
        :root {
            --primary-red: #ff4d6d;
            --soft-pink: #fff0f3;
            --dark-text: #590d22;
            --card-bg: rgba(255, 255, 255, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--soft-pink);
            color: var(--dark-text);
            overflow-x: hidden;
        }

        /* Hero Section */
        header {
            position: relative;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: url('https://images.unsplash.com/photo-1518192161668-5fd14c4bf1ef?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
        }

        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(89, 13, 34, 0.4);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            color: white;
            padding: 20px;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .hero-content p {
            font-size: 1.2rem;
            font-weight: 300;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        /* Games Section */
        .games-container {
            max-width: 800px;
            margin: -50px auto 50px;
            padding: 20px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .game-card h2 {
            color: var(--primary-red);
            margin-bottom: 15px;
        }

        /* Catch the Heart Game */
        #catch-area {
            width: 100%;
            height: 250px;
            background: white;
            border: 2px dashed var(--primary-red);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        #moving-heart {
            font-size: 2.5rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        /* Love Match Game */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .memory-card {
            background: var(--primary-red);
            height: 80px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            color: transparent; /* Hide emoji initially */
            transition: transform 0.3s, background 0.3s;
        }

        .memory-card.flipped, .memory-card.matched {
            background: white;
            color: var(--dark-text);
            border: 2px solid var(--primary-red);
            transform: rotateY(180deg);
        }

        /* Victory Modal */
        #winModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 243, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #winModal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 15px 40px rgba(255, 77, 109, 0.3);
            transform: translateY(20px);
            transition: transform 0.5s ease;
        }

        #winModal.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h1 {
            color: var(--primary-red);
            margin-bottom: 15px;
            font-size: 2.2rem;
        }

        .modal-content p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: var(--dark-text);
        }

        .btn {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #c9184a;
        }

        /* Falling Hearts Animation */
        .falling-heart {
            position: fixed;
            top: -5vh;
            font-size: 1.5rem;
            z-index: 99;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .hero-content h1 { font-size: 2.5rem; }
            .memory-grid { gap: 5px; }
            .memory-card { height: 70px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="hero-content">
            <h1>For Rishuuuu</h1>
            <p>My ultimate victory is you. ❤️</p>
        </div>
    </header>

    <div class="games-container">
        
        <div class="game-card">
            <h2>Catch My Heart</h2>
            <p>Catch the heart 5 times to win! (Score: <span id="score">0</span>/5)</p>
            <div id="catch-area">
                <div id="moving-heart">💖</div>
            </div>
        </div>

        <div class="game-card">
            <h2>Love Match</h2>
            <p>Find all the matching pairs!</p>
            <div class="memory-grid" id="memory-board">
                </div>
        </div>

    </div>

    <div id="winModal">
        <div class="modal-content">
            <h1>I love my love! ❤️</h1>
            <p>You are amazing, Rishuuuu. Every time you win, my heart skips a beat. Remember, losing to you is my greatest victory in love.</p>
            <button class="btn" onclick="closeModal()">Play Again, My Love</button>
        </div>
    </div>

    <script>
        // --- Core Modal & Animation Logic ---
        function triggerVictory() {
            const modal = document.getElementById('winModal');
            modal.classList.add('active');
            createHeartShower();
        }

        function closeModal() {
            document.getElementById('winModal').classList.remove('active');
            resetGames();
        }

        function createHeartShower() {
            for (let i = 0; i < 40; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = ['❤️', '💖', '🌹', '✨'][Math.floor(Math.random() * 4)];
                heart.classList.add('falling-heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                document.body.appendChild(heart);
                
                // Cleanup DOM
                setTimeout(() => { heart.remove(); }, 5000);
            }
        }

        function resetGames() {
            catchScore = 0;
            document.getElementById('score').innerText = catchScore;
            centerHeart();
            setupMemoryGame();
        }

        // --- Game 1: Catch My Heart ---
        const heartEl = document.getElementById('moving-heart');
        const catchArea = document.getElementById('catch-area');
        let catchScore = 0;

        function moveHeart() {
            const maxX = catchArea.clientWidth - 50;
            const maxY = catchArea.clientHeight - 50;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            heartEl.style.left = randomX + 'px';
            heartEl.style.top = randomY + 'px';
            heartEl.style.transform = 'translate(0, 0)'; 
        }

        function centerHeart() {
            heartEl.style.top = '50%';
            heartEl.style.left = '50%';
            heartEl.style.transform = 'translate(-50%, -50%)';
        }

        heartEl.addEventListener('click', () => {
            catchScore++;
            document.getElementById('score').innerText = catchScore;
            
            if (catchScore >= 5) {
                triggerVictory();
                centerHeart();
            } else {
                moveHeart();
            }
        });

        // Optional: Make it slightly evasive on hover for desktop, but still easy
        heartEl.addEventListener('mouseenter', () => {
            if(Math.random() > 0.6) moveHeart(); 
        });


        // --- Game 2: Love Match ---
        const memoryBoard = document.getElementById('memory-board');
        const emojis = ['🌹', '🌹', '💍', '💍', '💖', '💖', '💌', '💌'];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0;

        function setupMemoryGame() {
            memoryBoard.innerHTML = '';
            matchedPairs = 0;
            // Shuffle array safely
            let shuffled = emojis.sort(() => 0.5 - Math.random());
            
            shuffled.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.emoji = emoji;
                card.innerText = emoji;
                card.addEventListener('click', flipCard);
                memoryBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            resetBoard();
            
            matchedPairs++;
            if(matchedPairs === (emojis.length / 2)) {
                setTimeout(triggerVictory, 500);
            }
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        // Initialize games on load
        setupMemoryGame();

    </script>
</body>
</html>
